<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vega Autofill</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f9fafb;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover { background-color: #4338ca; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    input[type="email"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 8px;
      outline: none;
    }
    input[type="email"]:focus, input[type="password"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99,102,241,0.15);
    }
    #errorMsg {
      color: #dc2626;
      font-size: 12px;
      margin-top: 8px;
    }
    .shortcuts { margin-top: 20px; padding-top: 16px; border-top: 1px solid #e5e7eb; }
    .shortcuts h3 { font-size: 13px; margin: 0 0 8px 0; color: #374151; }
    .shortcut-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 6px;
    }
    kbd {
      background-color: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 2px 4px;
      font-family: inherit;
      font-size: 11px;
      color: #374151;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 28px;
      height: 16px;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 16px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 12px; width: 12px;
      left: 2px; bottom: 2px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(12px); }
  </style>
</head>
<body>
  <h2>✨ Vega Smart Autofill</h2>

  <!-- Login section -->
  <div id="loginSection" style="display:none;">
    <p style="font-size:13px;color:#6b7280;margin:0 0 12px;">Sign in to connect to your Vega account.</p>
    <input id="loginEmail" type="email" placeholder="you@email.com" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <div id="loginError" style="color:#dc2626;font-size:12px;margin-bottom:8px;min-height:16px;"></div>
    <button id="loginBtn">Sign in</button>

    <div style="display:flex;align-items:center;margin:12px 0;">
      <div style="flex:1;height:1px;background:#e5e7eb;"></div>
      <span style="margin:0 8px;font-size:11px;color:#9ca3af;">or</span>
      <div style="flex:1;height:1px;background:#e5e7eb;"></div>
    </div>

    <button id="googleLoginBtn" style="background-color:#ffffff;color:#374151;border:1px solid #d1d5db;display:flex;align-items:center;justify-content:center;gap:8px;">
      <svg width="16" height="16" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.4 0 10.3-2 13.9-5.4l-6.4-5.4C29.6 35 26.9 36 24 36c-5.3 0-9.6-3.1-11.3-7.6l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.4 5.4C40.9 36 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"/>
      </svg>
      Sign in with Google
    </button>
  </div>

  <!-- Main section -->
  <div id="mainSection" style="display:none;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div id="status" class="status" style="margin-bottom:0;">Loading profile...</div>
      <button id="logoutBtn" style="width:auto;background:#f3f4f6;color:#6b7280;font-size:11px;padding:4px 10px;font-weight:500;">Log out</button>
    </div>

    <button id="autofillBtn" disabled>Autofill Form</button>

    <div style="display:flex;gap:8px;margin-top:8px;">
      <button id="evaluateBtn" style="flex:1;background-color:#10b981;">Evaluate Job</button>
      <button id="saveJobBtn" style="flex:1;background-color:#4f46e5;">Save as Applied</button>
    </div>

    <div id="evalResult" style="display:none;margin-top:12px;padding:10px;border-radius:6px;font-size:13px;font-weight:500;"></div>
    <div id="errorMsg"></div>

    <div style="margin-top:16px;padding-top:16px;border-top:1px solid #e5e7eb;">
      <h3 style="font-size:13px;margin:0 0 8px 0;color:#374151;">Settings</h3>
      <label style="display:flex;align-items:center;cursor:pointer;font-size:12px;color:#4b5563;margin-bottom:12px;">
        <div class="switch">
          <input type="checkbox" id="autoEvalToggle">
          <span class="slider"></span>
        </div>
        Auto-Evaluate Jobs on Page Load
      </label>

      <h3 style="font-size:13px;margin:0 0 8px 0;color:#374151;">Upload Resume (PDF)</h3>
      <input type="file" id="resumeUpload" accept=".pdf" style="font-size:12px;width:100%;color:#6b7280;margin-bottom:8px;" />
      <div id="resumeStatus" style="font-size:11px;color:#10b981;display:none;">✓ Saved: <span id="resumeName"></span></div>
    </div>

    <div class="shortcuts">
      <h3>Useful Shortcuts</h3>
      <div class="shortcut-row">
        <span>Open Extension</span>
        <span><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>K</kbd></span>
      </div>
      <div class="shortcut-row">
        <span>Evaluate Job</span>
        <span><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>O</kbd></span>
      </div>
      <div class="shortcut-row">
        <span>Close Extension</span>
        <span><kbd>Esc</kbd></span>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-top:12px;">
      <button id="debugToggleBtn" style="flex:1;background-color:#f3f4f6;color:#374151;font-size:12px;padding:6px;">Show Debug Logs</button>
      <button id="clearLogsBtn" style="flex:1;background-color:#f3f4f6;color:#374151;font-size:12px;padding:6px;display:none;">Clear Logs</button>
    </div>
    <textarea id="debugLogs" readonly style="display:none;width:100%;height:100px;margin-top:8px;font-family:monospace;font-size:10px;border:1px solid #d1d5db;border-radius:4px;padding:4px;box-sizing:border-box;"></textarea>
  </div>

  <script src="popup.js"></script>
</body>
</html>
